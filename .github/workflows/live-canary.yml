name: Live data canary

# Unit tests mock HTTP, so upstream nflverse asset drift is invisible to CI.
# This runs every loader against live assets on a schedule so drift surfaces
# as a red run instead of a user bug report.
on:
  schedule:
    - cron: '17 9 * * 1,4' # Mon + Thu 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run live smoke test
        run: node scripts/live-smoke.mjs
